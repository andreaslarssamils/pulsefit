<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server error — PulseFit</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background: #080808;
            color: #fafafa;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .wrap { max-width: 520px; }
        .eyebrow {
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #a1a1aa;
            margin: 0 0 8px;
        }
        h1 { font-size: 40px; line-height: 1.1; margin: 0 0 16px; }
        p { color: #a1a1aa; margin: 0 0 24px; line-height: 1.6; }
        a {
            display: inline-block;
            background: linear-gradient(135deg, #ff8a3d, #fb6e1e);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="eyebrow">Error 500</p>
        <h1>Something went wrong</h1>
        <p>An unexpected error occurred on our end. We've been notified and are looking into it.</p>
        <a href="/">Back to home</a>
    </div>
</body>
</html>
