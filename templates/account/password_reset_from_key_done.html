{% extends "base.html" %}
{% load i18n %}

{% block title %}Password changed — PulseFit{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-shell">
        <div class="auth-card">
            <h1>{% trans "Password changed" %}</h1>
            <p class="text-muted">{% trans "Your password has been updated. You can now sign in with your new password." %}</p>
            <a class="btn btn-primary btn-block" href="{% url 'account_login' %}" style="margin-top: var(--space-base);">
                {% trans "Sign in" %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
